[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PUBLIC_SITE_URL = "https://ciudadycuerpo.com"
  # Identificadores públicos de Sanity (también se ven en cada URL de imagen). Con ellos el sitio se
  # construye desde el CMS; si se quitan, vuelve a leer el seed local. Ver site/src/lib/content.ts.
  PUBLIC_SANITY_PROJECT_ID = "1x40dsfz"
  PUBLIC_SANITY_DATASET = "production"

# El webhook de Sanity (proyecto → API → Webhooks) debe hacer POST a un Build Hook de Netlify
# al crear, editar o borrar documentos "page" y "settings", para que cada publicación reconstruya el sitio.

# Contraseña opcional (site/netlify/edge-functions/gate.js): solo actúa mientras exista
# la variable SITE_PASSWORD en Netlify; sin ella deja pasar todo.
[[edge_functions]]
  function = "gate"
  path = "/*"

# Cabeceras de seguridad. Los embeds (YouTube, itch.io, Google Maps) son iframes salientes,
# así que X-Frame-Options (que protege de que NOS embeban) puede quedarse en DENY.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# styles.css y los scripts se referencian con ?v=<commit>, así que se pueden cachear para siempre.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
